name: Qualidade de Dados e Aplicacao
on:
  pull_request:
  push:
    branches: [main, engineering]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Checagem estatica
        run: python -m compileall -q scripts app tests
      - name: Linter (ruff, regras em ruff.toml)
        run: |
          python -m pip install ruff==0.16.9
          ruff check app scripts tests
      # Vulnerabilidade nova: atualizar a dependencia num PR proprio; --ignore-vuln so com
      # justificativa e data aqui e registro no Decision Log (docs/qa/relatorio-qa-av6.md, 4.1).
      - name: Vulnerabilidades conhecidas nas dependencias (pip-audit)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off
      - name: Testes com dados sinteticos
        run: python -m unittest discover -s tests -v
      - name: Piso de publicacao no versionado
        run: python scripts/verificar_piso.py
      - name: Impedir artefatos reais no commit
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(csv|parquet|zip)$'; then
            echo 'Artefatos brutos/analiticos versionados indevidamente' >&2
            exit 1
          fi
