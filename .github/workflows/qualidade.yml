name: Qualidade de Dados e Aplicacao
on:
  pull_request:
  push:
    branches: [main, engineering]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Checagem estatica
        run: python -m compileall -q scripts app tests
      - name: Testes com dados sinteticos
        run: python -m unittest discover -s tests -v
      - name: Piso de publicacao no versionado
        run: python scripts/verificar_piso.py
      - name: Impedir artefatos reais no commit
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(csv|parquet|zip)$'; then
            echo 'Artefatos brutos/analiticos versionados indevidamente' >&2
            exit 1
          fi
