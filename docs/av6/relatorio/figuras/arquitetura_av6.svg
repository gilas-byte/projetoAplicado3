<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="setaA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="setaV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="2000" height="1180" fill="#ffffff"/>
  <text x="1000" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#111827">Radar ENEM: arquitetura final da solução (dados, código e nuvem)</text>

  <!-- OFFLINE -->
  <rect x="20" y="90" width="1180" height="470" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="44" y="126" font-size="22" font-weight="bold" fill="#334155">OFFLINE · lote na máquina da equipe · uma execução por edição publicada pelo INEP</text>

  <rect x="44" y="150" width="250" height="230" rx="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="169" y="188" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Fonte: INEP</text>
  <text x="169" y="224" text-anchor="middle" font-size="19" fill="#111827">4 arquivos .zip</text>
  <text x="169" y="252" text-anchor="middle" font-size="19" fill="#111827">2019 a 2022</text>
  <text x="169" y="280" text-anchor="middle" font-size="19" fill="#111827">2,40 GB</text>
  <text x="169" y="330" text-anchor="middle" font-size="17" fill="#374151">públicos e anonimizados</text>
  <text x="169" y="354" text-anchor="middle" font-size="17" fill="#374151">SHA-256 versionado</text>

  <rect x="334" y="150" width="250" height="230" rx="10" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="459" y="188" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">RAW (bronze)</text>
  <text x="459" y="224" text-anchor="middle" font-size="19" fill="#111827">CSV latin-1, 76 colunas</text>
  <text x="459" y="252" text-anchor="middle" font-size="19" fill="#111827">17.744.217 linhas</text>
  <text x="459" y="280" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">7,51 GB</text>
  <text x="459" y="340" text-anchor="middle" font-size="17" fill="#374151">verify_raw.sh</text>

  <rect x="624" y="150" width="250" height="230" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="749" y="188" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">TRUSTED (prata)</text>
  <text x="749" y="224" text-anchor="middle" font-size="19" fill="#111827">Parquet ZSTD por edição</text>
  <text x="749" y="252" text-anchor="middle" font-size="19" fill="#111827">58 + 4 colunas</text>
  <text x="749" y="280" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">374,3 MB (−95,0%)</text>
  <text x="749" y="330" text-anchor="middle" font-size="17" fill="#374151">funil de elegibilidade</text>
  <text x="749" y="354" text-anchor="middle" font-size="17" fill="#374151">9.214.868 elegíveis</text>

  <rect x="914" y="150" width="262" height="230" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="1045" y="188" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">ANALYTICS (ouro)</text>
  <text x="1045" y="222" text-anchor="middle" font-size="17" fill="#111827">dist_notas · dist_exata</text>
  <text x="1045" y="248" text-anchor="middle" font-size="17" fill="#111827">dist_equidade</text>
  <text x="1045" y="274" text-anchor="middle" font-size="17" fill="#111827">dist_territorial · dist_capital</text>
  <text x="1045" y="306" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">5 artefatos, 12,6 MB</text>
  <text x="1045" y="340" text-anchor="middle" font-size="17" fill="#374151">CDF exata: só backend</text>
  <text x="1045" y="364" text-anchor="middle" font-size="17" fill="#374151">piso de 100 na exibição</text>

  <line x1="294" y1="265" x2="330" y2="265" stroke="#1f2937" stroke-width="4" marker-end="url(#seta)"/>
  <line x1="584" y1="265" x2="620" y2="265" stroke="#1f2937" stroke-width="4" marker-end="url(#seta)"/>
  <line x1="874" y1="265" x2="910" y2="265" stroke="#1f2937" stroke-width="4" marker-end="url(#seta)"/>

  <rect x="44" y="410" width="540" height="128" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="314" y="444" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">etl.py + módulos (DuckDB 1.5.5)</text>
  <text x="314" y="474" text-anchor="middle" font-size="18" fill="#111827">contrato de dados, escrita atômica, manifestos</text>
  <text x="314" y="502" text-anchor="middle" font-size="18" fill="#111827">CDF conferida contra contagem direta: 0,0 pp</text>
  <text x="314" y="528" text-anchor="middle" font-size="17" fill="#374151">112,3 s e pico de 2,65 GB (ETL base)</text>

  <rect x="624" y="410" width="552" height="128" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="900" y="444" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">auditar_artefatos.py (barreira)</text>
  <text x="900" y="474" text-anchor="middle" font-size="18" fill="#111827">colunas, chave do grão, piso, coerência das CDFs,</text>
  <text x="900" y="502" text-anchor="middle" font-size="18" fill="#111827">Brasil igual entre artefatos e SHA-256</text>
  <text x="900" y="528" text-anchor="middle" font-size="17" fill="#374151">publicar só com saída 0 (DL-08)</text>

  <!-- GITHUB -->
  <rect x="1240" y="90" width="740" height="470" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="1264" y="126" font-size="22" font-weight="bold" fill="#4c1d95">GITHUB · gilas-byte/projetoAplicado3</text>
  <rect x="1264" y="150" width="330" height="190" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1429" y="186" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Repositório (main)</text>
  <text x="1429" y="220" text-anchor="middle" font-size="18" fill="#111827">código, testes, documentação</text>
  <text x="1429" y="248" text-anchor="middle" font-size="18" fill="#111827">PR com revisão de outro integrante</text>
  <text x="1429" y="276" text-anchor="middle" font-size="18" fill="#111827">tags de entrega e de release</text>
  <text x="1429" y="318" text-anchor="middle" font-size="17" fill="#b91c1c">data/ fora do git (R1)</text>
  <rect x="1630" y="150" width="326" height="190" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1793" y="186" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">GitHub Actions</text>
  <text x="1793" y="220" text-anchor="middle" font-size="18" fill="#111827">qualidade.yml (cada PR):</text>
  <text x="1793" y="246" text-anchor="middle" font-size="17" fill="#111827">280 testes, ruff, pip-audit,</text>
  <text x="1793" y="270" text-anchor="middle" font-size="17" fill="#111827">piso e bloqueio de dados</text>
  <text x="1793" y="304" text-anchor="middle" font-size="18" fill="#111827">monitor-producao.yml:</text>
  <text x="1793" y="328" text-anchor="middle" font-size="17" fill="#111827">checar_saude.py a cada 3 h</text>
  <rect x="1264" y="370" width="692" height="168" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="1610" y="404" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Governança registrada no repositório</text>
  <text x="1610" y="436" text-anchor="middle" font-size="18" fill="#111827">Decision Log (DL-01 a DL-10), ADR-001, privacidade (R1 a R7),</text>
  <text x="1610" y="464" text-anchor="middle" font-size="18" fill="#111827">contrato de dados, dicionário de indicadores, relatórios de QA,</text>
  <text x="1610" y="492" text-anchor="middle" font-size="18" fill="#111827">procedimento de publicação e prompt do agente versionados</text>
  <text x="1610" y="522" text-anchor="middle" font-size="17" fill="#374151">a mudança só chega à produção depois do merge</text>

  <!-- REPLIT -->
  <rect x="20" y="610" width="1360" height="420" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="470" y="646" font-size="22" font-weight="bold" fill="#9a3412">NUVEM (PaaS) · Replit · projeto privado · South America</text>
  <rect x="44" y="672" width="400" height="330" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="244" y="708" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Projeto (workspace)</text>
  <text x="244" y="742" text-anchor="middle" font-size="18" fill="#111827">cópia da main importada do GitHub</text>
  <text x="244" y="770" text-anchor="middle" font-size="18" fill="#111827">data/analytics/ enviado à mão</text>
  <text x="244" y="798" text-anchor="middle" font-size="18" fill="#111827">hashes conferidos no Shell</text>
  <text x="244" y="842" text-anchor="middle" font-size="18" fill="#111827">agente do Replit: só configura</text>
  <text x="244" y="868" text-anchor="middle" font-size="18" fill="#111827">(prompt fechado, sem alterar código)</text>
  <text x="244" y="918" text-anchor="middle" font-size="17" fill="#b91c1c">nunca push da main do Replit</text>
  <text x="244" y="946" text-anchor="middle" font-size="17" fill="#374151">publicar = cópia congelada</text>

  <rect x="500" y="672" width="850" height="330" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <text x="522" y="708" font-size="22" font-weight="bold" fill="#111827">Publicação · Reserved VM (0,5 vCPU, 2 GB), sempre ligada</text>
  <rect x="530" y="730" width="380" height="250" rx="10" fill="#ffffff" stroke="#9a3412" stroke-width="2"/>
  <text x="720" y="764" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">Streamlit 1.66.1 (porta 8501)</text>
  <text x="720" y="796" text-anchor="middle" font-size="18" fill="#111827">Início + 3 módulos autorais</text>
  <text x="720" y="824" text-anchor="middle" font-size="18" fill="#111827">cache_resource só leitura</text>
  <text x="720" y="852" text-anchor="middle" font-size="18" fill="#111827">motor estatístico (Python)</text>
  <text x="720" y="880" text-anchor="middle" font-size="18" fill="#111827">entrada só na sessão (R6)</text>
  <text x="720" y="920" text-anchor="middle" font-size="17" fill="#374151">XSRF, CORS, upload de 1 MB,</text>
  <text x="720" y="944" text-anchor="middle" font-size="17" fill="#374151">sem telemetria, erros só com o tipo</text>
  <rect x="950" y="730" width="370" height="250" rx="10" fill="#ffffff" stroke="#9a3412" stroke-width="2"/>
  <text x="1135" y="764" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">Arquivos locais da VM</text>
  <text x="1135" y="798" text-anchor="middle" font-size="18" fill="#111827">data/analytics/*.parquet</text>
  <text x="1135" y="826" text-anchor="middle" font-size="18" fill="#111827">fora da pasta servida</text>
  <text x="1135" y="854" text-anchor="middle" font-size="18" fill="#111827">app/static/: só as fontes</text>
  <text x="1135" y="882" text-anchor="middle" font-size="18" fill="#111827">IBM Plex (DL-09)</text>
  <text x="1135" y="930" text-anchor="middle" font-size="17" fill="#374151">leitura local, sem rede</text>
  <line x1="950" y1="855" x2="914" y2="855" stroke="#1f2937" stroke-width="3" marker-end="url(#seta)"/>

  <!-- USUARIO -->
  <rect x="1440" y="640" width="540" height="160" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1710" y="680" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Usuário (navegador)</text>
  <text x="1710" y="714" text-anchor="middle" font-size="18" fill="#111827">radarenem-projetoaplicado3-</text>
  <text x="1710" y="740" text-anchor="middle" font-size="18" fill="#111827">kirasapiens.replit.app</text>
  <text x="1710" y="774" text-anchor="middle" font-size="17" fill="#374151">HTTPS 443 + WebSocket, TLS e HSTS do Replit</text>
  <rect x="1440" y="840" width="540" height="160" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="1710" y="880" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Monitor externo (GitHub Actions, a cada 3 h)</text>
  <text x="1710" y="914" text-anchor="middle" font-size="18" fill="#111827">GET /_stcore/health e página inicial</text>
  <text x="1710" y="942" text-anchor="middle" font-size="18" fill="#111827">tenta baixar os 5 artefatos: deve falhar</text>
  <text x="1710" y="974" text-anchor="middle" font-size="17" fill="#374151">código 1 = fora do ar · código 2 = exposição</text>

  <!-- setas entre zonas -->
  <polyline points="1300,540 1300,585 244,585 244,666" fill="none" stroke="#6d28d9" stroke-width="4" marker-end="url(#seta)"/>
  <rect x="470" y="568" width="560" height="32" fill="#ffffff"/>
  <text x="750" y="591" text-anchor="middle" font-size="18" fill="#4c1d95" font-weight="bold">código: importação / fetch + reset da main (depois do merge)</text>
  
  <polyline points="1176,474 1215,474 1215,726" fill="none" stroke="#15803d" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#setaV)"/>
  <text x="1232" y="634" font-size="17" fill="#15803d" font-weight="bold">artefatos: upload manual</text>
  <text x="1232" y="656" font-size="17" fill="#15803d" font-weight="bold">com SHA-256 conferido</text>
  <line x1="1436" y1="720" x2="1354" y2="760" stroke="#1d4ed8" stroke-width="4" marker-end="url(#setaA)" marker-start="url(#setaA)"/>
  <line x1="1436" y1="920" x2="1354" y2="900" stroke="#047857" stroke-width="4" marker-end="url(#setaV)"/>
  

  <text x="1000" y="1080" text-anchor="middle" font-size="19" fill="#374151">O RAW e a TRUSTED nunca saem da máquina da equipe; só os agregados da ANALYTICS chegam à nuvem, e só o backend os lê.</text>
  <text x="1000" y="1112" text-anchor="middle" font-size="19" fill="#374151">O que o usuário digita é usado só para calcular o resultado da sessão e não é gravado em arquivo, log, URL ou serviço de terceiros.</text>
  <text x="1000" y="1150" text-anchor="middle" font-size="16" fill="#6b7280">Elaborado pela equipe Radar ENEM (AV6, 24/11/2026). Números das seções 3, 6 e 7 deste relatório.</text>
</svg>
